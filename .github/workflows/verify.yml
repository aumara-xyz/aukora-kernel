name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 20.19.0
            npm-version: 10.8.2
          - node-version: 24.11.1
            npm-version: 11.6.2
          - node-version: 24.11.1
            npm-version: 11.8.0
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Use pinned Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Use pinned npm
        run: npm install --global npm@${{ matrix.npm-version }}

      - name: Use pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Record toolchain
        run: |
          node --version
          npm --version
          bun --version

      - name: Install locked dependencies
        run: npm ci

      - name: Run portable and reference release gates
        run: npm run test:release
        env:
          AUKORA_REQUIRE_BUN: "1"

      - name: Audit portable production dependencies
        run: npm audit --omit=dev --workspace @aukora/kernel

      - name: Audit complete reference repository
        run: npm audit
